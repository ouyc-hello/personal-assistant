[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant-cli"
version = "0.1.0"
description = "CLI-first personal assistant with LangChain, LangGraph, PostgreSQL/pgvector, Milvus and Neo4j."
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "prompt-toolkit>=3.0,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "pymilvus>=2.4,<3.0",
  "neo4j>=5.24,<6.0",
  "python-dotenv>=1.0,<2.0",
  "pypdf>=5.0,<6.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2,<1.0"]
local = ["langchain-huggingface>=0.1,<1.0", "sentence-transformers>=3.0,<4.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[project.scripts]
assistant = "personal_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
